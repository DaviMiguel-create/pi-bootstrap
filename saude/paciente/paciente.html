<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel do Paciente</title>

  <!-- Bootstrap controla layout, grid, botões e responsividade -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="paciente.css">
</head>

<body>

  <!-- ===================================================== -->
  <!-- 🔥 NAVBAR RESPONSIVA -->
  <!-- ===================================================== -->
  <nav class="navbar navbar-expand-md navbar-dark bg-success">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="#">Área do Paciente</a>

      <!-- Botão hambúrguer -->
      <button class="navbar-toggler" type="button"
              data-bs-toggle="offcanvas"
              data-bs-target="#menuPaciente">
        <span class="navbar-toggler-icon"></span>
      </button>
    </div>
  </nav>


  <!-- ===================================================== -->
  <!-- 🔥 OFFCANVAS MENU (Mobile-First) -->
  <!-- ===================================================== -->
  <div class="offcanvas offcanvas-start bg-success text-white"
       tabindex="-1"
       id="menuPaciente">

    <div class="offcanvas-header">
      <h5 class="offcanvas-title fw-bold">Menu</h5>
      <button type="button" class="btn-close btn-close-white"
              data-bs-dismiss="offcanvas"></button>
    </div>

    <div class="offcanvas-body">
      <ul class="nav nav-pills flex-column">
        <li class="nav-item">
          <a href="#" class="nav-link active bg-light text-success">
            Agendamentos
          </a>
        </li>
        <li>
          <a href="#" class="nav-link text-white">
            Histórico
          </a>
        </li>
        <li>
          <a href="#" class="nav-link text-white">
            Perfil
          </a>
        </li>
      </ul>
    </div>
  </div>


  <!-- ===================================================== -->
  <!-- 🔹 CONTEÚDO PRINCIPAL -->
  <!-- ===================================================== -->
  <main class="container py-5">

    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb">
        <li class="breadcrumb-item active" aria-current="page">
          Agendamentos
        </li>
      </ol>
    </nav>

    <!-- Header -->
    <header class="text-center mb-4">
      <h1 class="display-5 fw-bold text-success">
        Gerenciar Consultas
      </h1>
      <p class="lead text-muted">
        Selecione uma especialidade para agendar sua consulta.
      </p>
    </header>

    <!-- Card Principal -->
    <div class="card shadow-sm p-4">

      <!-- ================================================= -->
      <!-- 🔥 Floating Label (substitui label manual) -->
      <!-- ================================================= -->
      <div class="form-floating mb-4">
        <select id="specialty"
                class="form-select"
                aria-label="Escolher especialidade">
          <option value="" disabled selected>Selecione</option>
          <option value="cardiologia">Cardiologia</option>
          <option value="dermatologia">Dermatologia</option>
          <option value="pediatria">Pediatria</option>
          <option value="psicologia">Psicologia</option>
          <option value="odontologia">Odontologia</option>
        </select>
        <label for="specialty">Especialidade</label>
      </div>

      <!-- Grid Bootstrap -->
      <div class="row g-4" id="professional-list">
        <!-- Cards via JS -->
      </div>

    </div>

    <footer class="text-center mt-5 text-muted">
      &copy; 2025 Sistema de Saúde
    </footer>

  </main>


  <!-- ===================================================== -->
  <!-- 🔥 Toast Global -->
  <!-- ===================================================== -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="globalToast"
         class="toast align-items-center text-bg-success border-0">
      <div class="d-flex">
        <div class="toast-body">
          Consulta agendada com sucesso!
        </div>
        <button type="button"
                class="btn-close btn-close-white me-2 m-auto"
                data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="paciente.js"></script>
</body>
</html>
