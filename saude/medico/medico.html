<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MedDash | Gestão de Consultas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="medico.css">
</head>
<body>

    <aside class="sidebar d-none d-md-flex flex-column p-3 bg-white border-end">
        <div class="d-flex align-items-center mb-4 px-2">
            <i class="bi bi-hospital fs-3 text-success me-2"></i>
            <span class="fs-4 fw-bold text-dark">UPA</span>
        </div>
        <ul class="nav nav-pills flex-column mb-auto gap-2">
            <li class="nav-item">
                <a href="#" class="nav-link active"><i class="bi bi-calendar-check me-2"></i> Agenda</a>
            </li>
            <li class="nav-item">
                <a href="#" class="nav-link text-dark"><i class="bi bi-people me-2"></i> Pacientes</a>
            </li>
        </ul>
        <hr>
        <button class="btn btn-outline-danger btn-sm w-100">Sair</button>
    </aside>

    <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebarMobile">
        <div class="offcanvas-header border-bottom">
            <h5 class="offcanvas-title fw-bold text-success">Menu</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body" id="mobile-nav-container">
            </div>
    </div>

    <main class="main-content">
        <nav class="navbar d-md-none bg-success mb-3 px-3">
            <button class="navbar-toggler border-white" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMobile">
                <span class="navbar-toggler-icon"></span>
            </button>
            <span class="navbar-brand text-white fw-bold m-0">UPA</span>
        </nav>

        <div class="container-fluid py-4 px-md-5">
            <header class="row align-items-center mb-5 gy-3">
                <div class="col-12 col-sm">
                    <h1 class="h3 fw-bold mb-1">Agenda de Consultas</h1>
                    <p class="text-muted small mb-0">Gerencie seus atendimentos e horários.</p>
                </div>
                <div class="col-12 col-sm-auto">
                    <button class="btn btn-success px-4 d-flex align-items-center gap-2 w-100" data-bs-toggle="modal" data-bs-target="#modalConsulta">
                        <i class="bi bi-plus-lg"></i> Nova Consulta
                    </button>
                </div>
            </header>

            <section id="appointments-grid" class="row g-4">
                </section>
        </div>
    </main>

    <div class="modal fade" id="modalConsulta" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <form id="formConsulta" class="modal-content border-0 shadow">
                <div class="modal-header bg-light">
                    <h5 class="modal-title fw-bold text-dark">Agendar Consulta</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nome do Paciente</label>
                        <input type="text" id="nome" class="form-control" placeholder="Ex: João Silva" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Especialidade</label>
                        <select id="especialidade" class="form-select" required>
                            <option value="Clínico Geral">Clínico Geral</option>
                            <option value="Cardiologia">Cardiologia</option>
                            <option value="Pediatria">Pediatria</option>
                        </select>
                    </div>
                    <div class="row g-3">
                        <div class="col-6">
                            <label class="form-label fw-semibold text-nowrap">Data</label>
                            <input type="date" id="data" class="form-control" required>
                        </div>
                        <div class="col-6">
                            <label class="form-label fw-semibold text-nowrap">Horário</label>
                            <input type="time" id="horario" class="form-control" required>
                        </div>
                    </div>
                </div>
                <div class="modal-footer bg-light border-0">
                    <button type="button" class="btn btn-secondary shadow-sm" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-success px-4 shadow-sm">Confirmar Agendamento</button>
                </div>
            </form>
        </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="appToast" class="toast align-items-center text-white bg-dark border-0 shadow-lg" role="alert">
            <div class="d-flex">
                <div class="toast-body" id="toastMsg">Ação realizada!</div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="medico.js"></script>
</body>
</html>
