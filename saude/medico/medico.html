<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Painel Médico</title>

  <!-- Bootstrap substitui quase todo medico.css -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <link rel="stylesheet" href="medico.css">
</head>

<body>

  <!-- ===================================================== -->
  <!-- 🔥 NAVBAR RESPONSIVA (substitui header manual) -->
  <!-- ===================================================== -->
  <nav class="navbar navbar-expand-md navbar-dark bg-success">
    <div class="container-fluid">

      <a class="navbar-brand fw-bold" href="#">Painel Médico</a>

      <!-- Botão hambúrguer automático -->
      <button class="navbar-toggler" type="button"
              data-bs-toggle="offcanvas"
              data-bs-target="#sidebar">
        <span class="navbar-toggler-icon"></span>
      </button>

    </div>
  </nav>


  <!-- ===================================================== -->
  <!-- 🔥 SIDEBAR OFFCANVAS (Mobile-First real) -->
  <!-- ===================================================== -->
  <div class="offcanvas-md offcanvas-start bg-success text-white"
       tabindex="-1"
       id="sidebar">

    <div class="offcanvas-header">
      <h5 class="offcanvas-title fw-bold">Dr. Médico</h5>
      <button type="button" class="btn-close btn-close-white"
              data-bs-dismiss="offcanvas"></button>
    </div>

    <div class="offcanvas-body d-flex flex-column p-3">

      <!-- Antes: ul manual -->
      <!-- Agora: nav Bootstrap -->
      <ul class="nav nav-pills flex-column mb-auto">

        <li class="nav-item">
          <a href="#" class="nav-link active bg-light text-success fw-semibold">
            Agenda
          </a>
        </li>

        <li>
          <a href="#" class="nav-link text-white">
            Pacientes
          </a>
        </li>

        <li>
          <a href="#" class="nav-link text-white">
            Perfil
          </a>
        </li>

      </ul>

      <button id="logoutBtn" class="btn btn-dark mt-auto">
        Sair
      </button>

    </div>
  </div>


  <!-- ===================================================== -->
  <!-- 🔹 CONTEÚDO PRINCIPAL -->
  <!-- ===================================================== -->
  <main class="container-fluid p-4">

    <!-- Breadcrumb -->
    <nav aria-label="breadcrumb">
      <ol class="breadcrumb">
        <li class="breadcrumb-item active" aria-current="page">
          Agenda
        </li>
      </ol>
    </nav>

    <header class="mb-4">
      <h1 class="fw-bold text-success">Agenda de Consultas</h1>
      <p class="text-muted">Veja seus próximos atendimentos</p>
    </header>

    <!-- ===================================================== -->
    <!-- 🔥 GRID 12 COLUNAS -->
    <!-- ===================================================== -->
    <div class="row g-4" id="appointments-list">
      <!-- Cards inseridos via JS -->
    </div>


    <!-- ===================================================== -->
    <!-- 🔥 TABELA RESPONSIVA (exemplo escalável) -->
    <!-- ===================================================== -->
    <div class="card shadow-sm mt-5">
      <div class="card-header bg-success text-white">
        Pacientes Recentes
      </div>

      <div class="table-responsive">
        <table class="table table-striped table-hover mb-0">
          <thead class="table-success">
            <tr>
              <th>Nome</th>
              <th>Data</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Maria Souza</td>
              <td>15/03/2026</td>
              <td><span class="badge bg-success">Confirmado</span></td>
            </tr>
            <tr>
              <td>João Pedro</td>
              <td>18/03/2026</td>
              <td><span class="badge bg-warning text-dark">Pendente</span></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>


  <!-- ===================================================== -->
  <!-- 🔥 Toast Global -->
  <!-- ===================================================== -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="globalToast" class="toast align-items-center text-bg-success border-0">
      <div class="d-flex">
        <div class="toast-body">
          Ação realizada com sucesso!
        </div>
        <button type="button"
                class="btn-close btn-close-white me-2 m-auto"
                data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>


  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="medico.js"></script>
</body>
</html>
