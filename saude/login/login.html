<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>

  <!-- Bootstrap controla layout, grid, inputs e responsividade -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- CSS apenas para identidade visual -->
  <link rel="stylesheet" href="login.css">
</head>

<!-- 🔹 Antes: flex manual no CSS
     🔹 Agora: utilitários Bootstrap -->
<body class="d-flex align-items-center justify-content-center min-vh-100 bg-success-subtle">

  <main class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-sm-8 col-md-6 col-lg-4">

        <!-- 🔹 Card substitui layout manual -->
        <div class="card shadow-lg border-0">

          <div class="card-body p-4">

            <h1 class="text-center mb-4 text-success fw-bold">
              Login
            </h1>

            <!-- 🔹 novalidate para usar validação Bootstrap -->
            <form id="loginForm" novalidate>

              <!-- ================================================= -->
              <!-- 🔥 Floating Label (substitui label + input manual) -->
              <!-- ================================================= -->
              <div class="form-floating mb-3">
                <input type="text"
                       class="form-control"
                       id="nome"
                       placeholder="Nome"
                       required>
                <label for="nome">Nome</label>
                <div class="invalid-feedback">
                  Por favor, informe seu nome.
                </div>
              </div>

              <!-- ================================================= -->
              <!-- 🔥 Input Group (ícone visual) -->
              <!-- ================================================= -->
              <div class="input-group mb-3">
                <span class="input-group-text">🔒</span>
                <div class="form-floating">
                  <input type="password"
                         class="form-control"
                         id="senha"
                         placeholder="Senha"
                         required>
                  <label for="senha">Senha</label>
                </div>
                <div class="invalid-feedback">
                  Informe sua senha.
                </div>
              </div>

              <!-- ================================================= -->
              <!-- 🔹 Select Bootstrap -->
              <!-- ================================================= -->
              <div class="form-floating mb-4">
                <select class="form-select"
                        id="tipo"
                        required>
                  <option value="">Selecione</option>
                  <option value="paciente">Paciente</option>
                  <option value="medico">Médico</option>
                </select>
                <label for="tipo">Tipo de usuário</label>
                <div class="invalid-feedback">
                  Selecione o tipo de usuário.
                </div>
              </div>

              <!-- 🔹 Botão Bootstrap -->
              <div class="d-grid">
                <button type="submit"
                        class="btn btn-success btn-lg"
                        aria-label="Entrar no sistema">
                  Entrar
                </button>
              </div>

            </form>

          </div>
        </div>

        <!-- 🔹 Breadcrumb exemplo (estrutura escalável) -->
        <nav class="mt-4" aria-label="breadcrumb">
          <ol class="breadcrumb justify-content-center">
            <li class="breadcrumb-item active" aria-current="page">
              Página de Login
            </li>
          </ol>
        </nav>

      </div>
    </div>
  </main>


  <!-- ================================================= -->
  <!-- 🔥 Toast de feedback -->
  <!-- ================================================= -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="loginToast" class="toast align-items-center text-bg-success border-0">
      <div class="d-flex">
        <div class="toast-body">
          Login realizado com sucesso!
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto"
                data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>


  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="login.js"></script>
</body>
</html>
