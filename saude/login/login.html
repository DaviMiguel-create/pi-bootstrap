<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedDash | Acesso ao Sistema</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="login.css">
</head>
<body class="bg-light-subtle d-flex flex-column min-vh-100">

    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold text-success" href="#">
                <i class="bi bi-hospital"></i> MedDash
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMenu" aria-controls="navbarMenu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="../paciente/paciente.html">Paciente</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../consulta/index.html">Consulta</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="../medico/medico.html">Médico</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container flex-grow-1 d-flex align-items-center">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
                
                <div class="text-center mb-4">
                    <div class="bg-success text-white d-inline-block p-3 rounded-circle shadow-sm mb-3">
                        <i class="bi bi-hospital fs-1"></i>
                    </div>
                    <h1 class="h3 fw-bold text-success">UPA</h1>
                  
                </div>

                <div class="card shadow border-0 overflow-hidden">
                    <div class="card-body p-4 p-md-5">
                        <form id="loginForm" novalidate>
                            
                            <div class="form-floating mb-3">
                                <input type="text" class="form-control" id="username" placeholder="Nome" required>
                                <label for="username">Usuário</label>
                                <div class="invalid-feedback">Por favor, informe seu usuário.</div>
                            </div>

                            <div class="form-floating mb-3">
                                <input type="password" class="form-control" id="password" placeholder="Senha" required>
                                <label for="password">Senha</label>
                                <div class="invalid-feedback">A senha é obrigatória.</div>
                            </div>

                            <div class="form-floating mb-4">
                                <select class="form-select" id="userRole" required>
                                    <option value="" selected disabled>Escolha seu perfil...</option>
                                  
                                    <option value="medico">Médico / Staff</option>
                                </select>
                                <label for="userRole">Tipo de Acesso</label>
                                <div class="invalid-feedback">Selecione um perfil para continuar.</div>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-success btn-lg fw-bold shadow-sm">
                                    Entrar no Sistema
                                </button>
                                <a href="#" class="btn btn-link btn-sm text-decoration-none text-muted">Esqueci minha senha</a>
                            </div>

                        </form>
                    </div>
                    <div class="card-footer bg-light border-0 py-3 text-center">
                        <span class="small text-muted">Ainda não tem acesso? <a href="#" class="text-success fw-bold">Solicite aqui</a></span>
                    </div>
                </div>

               

            </div>
        </div>
    </main>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="loginToast" class="toast align-items-center text-white border-0 shadow-lg" role="alert">
            <div class="d-flex">
                <div class="toast-body d-flex align-items-center gap-2">
                    <i id="toastIcon" class="bi"></i>
                    <span id="toastMessage"></span>
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="login.js"></script>
</body>
</html>
