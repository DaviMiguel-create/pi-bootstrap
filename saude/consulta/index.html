<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Consultas Online</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

<!-- ========================= -->
<!-- NAVBAR RESPONSIVA -->
<!-- ========================= -->
<nav class="navbar navbar-expand-lg navbar-dark bg-success shadow">
  <div class="container">
    <a class="navbar-brand fw-bold" href="#">Consultas Online</a>

    <!-- Navbar Toggler -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link active" href="#">Início</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Especialidades</a></li>
        <li class="nav-item">
          <button class="btn btn-outline-light btn-sm ms-3"
                  onclick="toggleTheme()">🌙 Dark</button>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- ========================= -->
<!-- BREADCRUMB -->
<!-- ========================= -->
<div class="container mt-3">
  <nav>
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="#">Home</a></li>
      <li class="breadcrumb-item active">Agendamento</li>
    </ol>
  </nav>
</div>

<!-- ========================= -->
<!-- CONTEÚDO PRINCIPAL -->
<!-- ========================= -->
<main class="container my-4">

  <div class="row">
    <div class="col-12">

      <!-- Card Avançado -->
      <div class="card shadow-lg">

        <div class="card-header bg-success text-white fw-bold">
          Agende sua Consulta
        </div>

        <div class="card-body">

          <!-- Floating Label -->
          <div class="form-floating mb-4">
            <select id="specialty"
                    class="form-select"
                    aria-label="Escolher especialidade">
              <option value="" disabled selected>Selecione</option>
              <option value="cardiologia">Cardiologia</option>
              <option value="dermatologia">Dermatologia</option>
              <option value="pediatria">Pediatria</option>
              <option value="psicologia">Psicologia</option>
              <option value="odontologia">Odontologia</option>
            </select>
            <label for="specialty">Escolha a especialidade</label>
          </div>

          <!-- GRID 12 COLUNAS -->
          <div class="row g-4" id="professional-list"></div>

        </div>

        <div class="card-footer text-muted text-center">
          Sistema Seguro • LGPD
        </div>

      </div>
    </div>
  </div>
</main>

<!-- ========================= -->
<!-- OFFCANVAS (Menu lateral) -->
<!-- ========================= -->
<div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasMenu">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title">Menu</h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
  </div>
  <div class="offcanvas-body">
    <p>Filtros e configurações futuras aqui.</p>
  </div>
</div>

<!-- ========================= -->
<!-- MODAL CONFIRMAÇÃO -->
<!-- ========================= -->
<div class="modal fade" id="confirmModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-success text-white">
        <h5 class="modal-title">Confirmar Consulta</h5>
        <button type="button" class="btn-close btn-close-white"
                data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        Deseja confirmar o agendamento?
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary"
                data-bs-dismiss="modal">Cancelar</button>
        <button class="btn btn-success"
                data-bs-dismiss="modal"
                onclick="showToast()">Confirmar</button>
      </div>
    </div>
  </div>
</div>

<!-- ========================= -->
<!-- TOAST -->
<!-- ========================= -->
<div class="toast-container position-fixed bottom-0 end-0 p-3 z-3">
  <div id="liveToast" class="toast align-items-center text-bg-success border-0">
    <div class="d-flex">
      <div class="toast-body">
        Consulta marcada com sucesso!
      </div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto"
              data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<footer class="text-center py-3 text-muted">
  &copy; 2025 Consultas Online
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>

<script>
function showToast() {
  const toast = new bootstrap.Toast(document.getElementById('liveToast'));
  toast.show();
}

function toggleTheme() {
  const html = document.documentElement;
  html.dataset.bsTheme =
    html.dataset.bsTheme === "dark" ? "light" : "dark";
}
</script>

</body>
</html>
