<!DOCTYPE html>
<html lang="pt-BR" >
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agendamento - Paciente</title>
  <link rel="stylesheet" href="paciente.css" />
</head>
<body>
  <header>
    <h1>Consultas Online</h1>
    <p>Agende sua consulta com especialistas confiáveis</p>
  </header>

  <main>
    <section class="welcome-section">
      <h2>Bem-vindo(a), Paciente!</h2>
      <p>Escolha a especialidade e o profissional para agendar sua consulta.</p>
    </section>

    <section class="appointment-section">
      <label for="specialty">Especialidade:</label>
      <select id="specialty">
        <option value="" disabled selected>Selecione uma especialidade</option>
        <option value="cardiologia">Cardiologia</option>
        <option value="dermatologia">Dermatologia</option>
        <option value="pediatria">Pediatria</option>
        <option value="psicologia">Psicologia</option>
        <option value="odontologia">Odontologia</option>
      </select>

      <div class="professional-list" id="professional-list">
        <!-- Cards de profissionais aparecem aqui -->
      </div>
    </section>
  </main>

  <footer>
    &copy; 2025 Consultas Online - Saúde ao seu alcance
  </footer>

  <script src="paciente.js"></script>
</body>
</html>
